name: Release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

env:
  # Rust features enabled during CI tests (comma-separated package/feature).
  # Keep in sync with build-test-rust.yml. A new feature is NOT tested in CI
  # until added here.
  TEST_FEATURES: "icann-rdap-srv/postgres,icann-rdap-srv/sqlx"
  # Rust features enabled in published release binaries.
  # A new feature is NOT shipped until added here.
  RELEASE_FEATURES: ""

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Check format
      run: cargo fmt --check
    - name: Build
      run: |
        if [ -n "${RELEASE_FEATURES}" ]; then
          cargo build --release --features "${RELEASE_FEATURES}" --verbose
        else
          cargo build --release --verbose
        fi
    - name: Run tests
      run: cargo test --features "${TEST_FEATURES}" --verbose
    - name: Install WASM32
      run: rustup target add wasm32-unknown-unknown
    - name: Check wasm32
      run: cargo check --target wasm32-unknown-unknown -p icann-rdap-client

  build:
    name: Release build
    needs: [test-build]
    if: startsWith(github.ref, 'refs/tags/')
    strategy: 
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            OS: ubuntu-latest
            EXT: ''
          - target: aarch64-unknown-linux-gnu 
            OS: ubuntu-latest
            EXT: ''
          - target: aarch64-apple-darwin
            OS: macos-latest
            EXT: ''
          - target: x86_64-pc-windows-msvc 
            OS: windows-latest
            EXT: .exe
    runs-on: ${{ matrix.OS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Install rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true
          target: ${{ matrix.target }}

      - name: Build target
        uses: actions-rs/cargo@v1
        with:
          use-cross: true
          command: build
          args: --release --target ${{ matrix.target }} ${{ env.RELEASE_FEATURES != '' && format('--features {0}', env.RELEASE_FEATURES) || '' }}

      - name: Package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release          
          tar czvf ../../../icann-rdap-${{ matrix.target }}.tar.gz \
            rdap${{ matrix.EXT }} \
            rdap-test${{ matrix.EXT }} \
            rdap-srv${{ matrix.EXT }} \
            rdap-srv-data${{ matrix.EXT }} \
            rdap-srv-store${{ matrix.EXT }} \
            rdap-srv-test-data${{ matrix.EXT }}
          cd -
      - name: Verify package contents
        shell: bash
        run: |
          archive="icann-rdap-${{ matrix.target }}.tar.gz"
          expected="$(mktemp)"
          actual="$(mktemp)"

          printf '%s\n' \
            "rdap${{ matrix.EXT }}" \
            "rdap-test${{ matrix.EXT }}" \
            "rdap-srv${{ matrix.EXT }}" \
            "rdap-srv-data${{ matrix.EXT }}" \
            "rdap-srv-store${{ matrix.EXT }}" \
            "rdap-srv-test-data${{ matrix.EXT }}" \
            | sort > "$expected"

          tar -tzf "$archive" | sort > "$actual"

          if ! diff -u "$expected" "$actual"; then
            echo "ERROR: unexpected contents in $archive"
            exit 1
          fi
      - name: Smoke test Windows package
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        run: |
          mkdir package-test
          tar -xzf icann-rdap-${{ matrix.target }}.tar.gz -C package-test
          ./package-test/rdap.exe --version
      - name: Publish
        uses: softprops/action-gh-release@v1
        with:
            files: 'icann-rdap-*'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


[workspace]
members = [
  "icann-rdap-cli",
  "icann-rdap-client",
  "icann-rdap-common",
  "icann-rdap-srv",
  "tests/downstream_compat"
]
resolver = "2"

[workspace.package]
version = "0.0.31"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/icann/icann-rdap"
keywords = ["whois", "rdap"]
rust-version = "1.97.1"

[workspace.dependencies]

# for suffix string searches
ab-radix-trie = "0.2.1"

# easy error handling
anyhow = "1.0"

# cli assertions
assert_cmd = "2.2"

# async traits
async-trait = "0.1"

# axum (web server)
axum = { version = "0.8" }
axum-extra = { version = "0.12", features = [ "typed-header" ] }
axum-macros = "0.5"

# client IP address extractor
axum-client-ip = "1"

# macros for the builder pattern
buildstructor = "0.6"

# CIDR utilities
cidr = "0.3.0"

# command line options parser
clap = { version = "4", features = [ "std", "derive", "env", "unstable-styles" ] }

# chrono (time and date library)
chrono = { version = "0.4", features = ["alloc", "std", "clock", "serde"], default-features = false }

# CIDR utilities
cidr-utils = "0.7"

# compile time constants formatting
const_format = "0.2"

# cross-platform application directories
directories = "6"

# loads environment variables from a file
dotenvy = "0.15"

# environment variable utilities
envmnt = "0.10.4"

# enumflags
enumflags2 = "0.7"

# futures
futures = "0.3"

# futures-utils
futures-util = "0.3"

# macros to get the git version
git-version = "0.3"

# goldfile
goldenfile = "1"

# headers (http headers)
headers = "0.4"

# Hickory DNS net client
hickory-net = "0.26"

# http constructs
http = "1"

# hyper (http implementation used by axum)
hyper = { version = "1", features = ["full"] }

# indoc
indoc = "2"

# JSONPath
jsonpath-rust = "1"
jsonpath_lib = "0.3.0"

# JSON Pretty Compact
json-pretty-compact = "0.1.2"

# internationalized domain names for applications
idna = "1"

# for use prefixmap
ipnet = { version = "2", features = ["json"] }

# embedded pager
minus = {version = "5", features = ["dynamic_output", "search"] }

# percent encoding
pct-str = "3.0"

# ip address trie
prefix-trie = "0.10"

# flexible range map
rangemap = "1"

# regular expressions
regex = "1"

# http client library
reqwest = {version = "0.13", features = ["json", "stream", "native-tls-vendored"]}

# fixture testings
rstest = "0.26.0"

# serialization / deserialization library
serde = { version = "1", features = [ "derive" ] }

# json serializer
serde_json = "1"

# serial testings
serial_test = "4"

# sqlx (async db)
sqlx = { version = "0.9", features = [
    "runtime-tokio",
    "tls-rustls",
    "chrono",
    "macros",
    "json",
] }

# enum utilities
strum = { version = "0.28", features = [ "derive" ] }

# temp files
tempfile = "3"

# terminal markdown generator
termimad = "0.35"

# test directories
test_dir = "0.2.0"

# error macros
thiserror = "2"

# tokio async runtime
tokio = { version = "1", features = [ "full" ] }

# tower (tokio/axum middleware)
tower = { version = "0.5", features = ["timeout", "util"] }
tower-http = { version = "0.7", features = [
    "add-extension",
    "trace",
    "cors",
] }

# tracing (logging)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# url
url = "2"


[profile.release]
codegen-units = 1
lto = true
